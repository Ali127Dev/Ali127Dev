<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="pulse">
      <stop offset="0%" stop-color="#F3E3B8"/>
      <stop offset="40%" stop-color="#C9A96E" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#C9A96E" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <style>
    .serif{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,'Times New Roman',serif}
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .eye{font-size:11px;letter-spacing:5px;fill:#6E6E6E}
    .node{fill:#0E0D0B;stroke:#C9A96E;stroke-opacity:.55}
    .t{font-size:12px;letter-spacing:4px;fill:#C9A96E}
    .s{font-size:11px;fill:#8A8A8A}
    .wire{fill:none;stroke:#C9A96E;stroke-opacity:.35;stroke-dasharray:3 5}
    .ic{fill:none;stroke:#C9A96E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="290" rx="10" fill="url(#grid)" stroke="#C9A96E" stroke-opacity=".2"/>

  <text x="56" y="60" class="sans eye">FIG. 01</text>
  <text x="1144" y="60" text-anchor="end" class="sans eye">TRANSACTIONAL OUTBOX  ·  AT-LEAST-ONCE</text>

  <!-- atomic boundary -->
  <rect x="226" y="96" width="338" height="128" rx="12" fill="#C9A96E" fill-opacity=".03" stroke="#C9A96E" stroke-opacity=".5" stroke-dasharray="2 4"/>
  <text x="395" y="88" text-anchor="middle" class="sans" font-size="10" letter-spacing="5" fill="#C9A96E" fill-opacity=".8">ONE TRANSACTION</text>

  <g class="wire">
    <path d="M190 160H240"/><path d="M370 160H420"/><path d="M550 160H600"/><path d="M730 160H780"/>
    <path d="M910 160C945 160 945 120 980 120"/><path d="M910 160H980"/><path d="M910 160C945 160 945 200 980 200"/>
  </g>
  <g fill="#C9A96E" fill-opacity=".6">
    <path d="M240 160l-7-4v8z"/><path d="M420 160l-7-4v8z"/><path d="M600 160l-7-4v8z"/><path d="M780 160l-7-4v8z"/>
  </g>

  <g class="node">
    <rect x="60" y="110" width="130" height="100" rx="8"/>
    <rect x="240" y="110" width="130" height="100" rx="8"/>
    <rect x="420" y="110" width="130" height="100" rx="8" stroke-opacity="1"/>
    <rect x="600" y="110" width="130" height="100" rx="8"/>
    <rect x="780" y="110" width="130" height="100" rx="8"/>
    <rect x="980" y="105" width="150" height="30" rx="6"/>
    <rect x="980" y="145" width="150" height="30" rx="6"/>
    <rect x="980" y="185" width="150" height="30" rx="6"/>
  </g>

  <g class="ic">
    <rect x="113" y="126" width="24" height="16" rx="2"/><path d="M119 148H131M125 142V148"/>
    <ellipse cx="485" cy="126" rx="12" ry="4"/><path d="M473 126V144a12 4 0 0 0 24 0V126M473 135a12 4 0 0 0 24 0"/>
    <path d="M655 135a10 10 0 0 1 17-7M672 128V122M672 128H666M675 135a10 10 0 0 1-17 7M658 142V148M658 142H664"/>
    <path d="M831 127H859M831 135H859M831 143H859"/>
  </g>
  <g fill="#C9A96E"><circle cx="837" cy="127" r="2.2"/><circle cx="851" cy="135" r="2.2"/><circle cx="843" cy="143" r="2.2"/></g>
  <text x="305" y="144" text-anchor="middle" class="serif" font-size="22" fill="#C9A96E">{ }</text>

  <g text-anchor="middle" class="sans">
    <text x="125" y="180" class="t">CLIENT</text><text x="125" y="198" class="s">request</text>
    <text x="305" y="180" class="t">SERVICE</text><text x="305" y="198" class="s">business logic</text>
    <text x="485" y="180" class="t">STORE</text><text x="485" y="198" class="s">state + outbox</text>
    <text x="665" y="180" class="t">RELAY</text><text x="665" y="198" class="s">poll · publish · ack</text>
    <text x="845" y="180" class="t">BROKER</text><text x="845" y="198" class="s">durable stream</text>
    <text x="1055" y="124" class="s" letter-spacing="3">CONSUMER · 01</text>
    <text x="1055" y="164" class="s" letter-spacing="3">CONSUMER · 02</text>
    <text x="1055" y="204" class="s" letter-spacing="3">CONSUMER · 03</text>
  </g>

  <g fill="url(#pulse)">
    <circle r="9"><animateMotion dur="5s" repeatCount="indefinite" path="M125 160H910C945 160 945 120 980 120"/></circle>
    <circle r="9"><animateMotion dur="5s" repeatCount="indefinite" path="M125 160H980"/></circle>
    <circle r="9"><animateMotion dur="5s" repeatCount="indefinite" path="M125 160H910C945 160 945 200 980 200"/></circle>
  </g>

  <text x="600" y="268" text-anchor="middle" class="serif" font-style="italic" font-size="20" fill="#BDBDBD">Every write committed. Every message delivered. Nothing lost in between.</text>
</svg>
