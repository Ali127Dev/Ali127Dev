<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAD7A6"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8C7243"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A1813"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
  </defs>
  <style>
    .serif{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,'Times New Roman',serif}
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
    .glow{animation:glow 4s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="320" rx="10" fill="none" stroke="#C9A96E" stroke-opacity=".22"/>
  <g stroke="#C9A96E" stroke-width="1.5" fill="none">
    <path d="M36 60 V36 H60"/><path d="M1140 36 H1164 V60"/>
    <path d="M36 300 V324 H60"/><path d="M1140 324 H1164 V300"/>
  </g>
  <text x="600" y="96" text-anchor="middle" class="sans" font-size="13" letter-spacing="7" fill="#8A8A8A">BACKEND ENGINEER  ·  DISTRIBUTED SYSTEMS</text>
  <text x="600" y="192" text-anchor="middle" class="serif" font-size="94" letter-spacing="3" fill="url(#gold)">Ali Moradi</text>
  <rect x="360" y="224" width="480" height="1" fill="url(#line)" class="glow"/>
  <rect x="596" y="220" width="8" height="8" fill="#C9A96E" transform="rotate(45 600 224)"/>
  <text x="600" y="270" text-anchor="middle" class="serif" font-style="italic" font-size="21" fill="#BDBDBD">Systems that stay calm under load.</text>
  <text x="64" y="310" class="sans" font-size="11" letter-spacing="4" fill="#5E5E5E">GO  ·  TYPESCRIPT  ·  POSTGRESQL</text>
  <text x="1136" y="310" text-anchor="end" class="sans" font-size="11" letter-spacing="4" fill="#5E5E5E">REMOTE  ·  OPEN TO RELOCATION</text>
</svg>
