<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .serif{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,'Times New Roman',serif}
    .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  </style>
  <rect width="1200" height="150" rx="18" fill="#0A0A0A"/>
  <rect x="20" y="20" width="1160" height="110" rx="10" fill="none" stroke="#C9A96E" stroke-opacity=".18"/>
  <text x="600" y="72" text-anchor="middle" class="serif" font-style="italic" font-size="24" fill="#C9A96E">Scales beautifully. Breaks gracefully.</text>
  <rect x="440" y="92" width="320" height="1" fill="url(#line)"/>
  <text x="600" y="114" text-anchor="middle" class="sans" font-size="10" letter-spacing="6" fill="#5E5E5E">ALI MORADI</text>
</svg>
